# yaml-language-server: $schema=../schemas/persisted-backup.json
---
persisted_backup:

  # Files with these extensions will not be checksummed
  # if the dst file exists, instead a comparison is made of
  # the sizes between src and dst. This is done so that ext's
  # associated with typically large binary files ( like media
  # files ) need not perform CPU-intensive compare tasks. A
  # simple compare of the size attribute is much more
  # economical in this case.

  # Leave value as empty list to checksum all files ( most
  # performance impacting, most accurate ).

  non_checksum_exts:
    - avi
    - m4v
    - mkv
    - mp3
    - mp4
    - mpg
    - wav
    - webm

  objects:
    - name: raid-1
      targets:
        - red/movies-e*
        - red/movies-m*
        - red/tv-main/2*
        - red/tv-main/9*
        - red/tv-main/G*
        - red/tv-main/J*
        - red/tv-main/O*
        - red/tv-main/P*

    - name: raid-2
      targets:
        - black
        - green
        - red/movies-do*
        - red/movies-s* 
        - red/tv-e*
        - red/tv-k*
        - red/tv-p*
        - red/tv-r*
        - red/tv-main/F*
        - red/tv-main/K*
        - red/tv-main/M*
        - red/tv-main/R*
        - red/tv-main/V*
        - red/tv-main/X*

    - name: raid-3
      targets:
        - white
        - red/movies-p*
        - red/tv-de*
        - red/tv-main/3*
        - red/tv-main/A*
        - red/tv-main/C*
        - red/tv-main/E*
        - red/tv-main/S*
        - red/tv-main/T*

    - name: raid-4
      targets:
        - blue
        - red/movies-de*
        - red/movies-k*
        - red/tv-do*
        - red/tv-main/1*
        - red/tv-main/B*
        - red/tv-main/D*
        - red/tv-main/H*
        - red/tv-main/I*
        - red/tv-main/L*
        - red/tv-main/N*
        - red/tv-main/Q*
        - red/tv-main/W*
        - red/tv-main/Y*

    - name: app
      targets:
        - b*
        - e*
        - f*
        - gi*
        - gl*
        - k*
        - ne*
        - ng*
        - o*
        - pi*
        - pl*
        - pr*
        - q*
        - ra*
        - re*
        - runner-a*
        - runner-u*
        - se*
        - so*
        - t*
        - v*
        - z*

  # project logging values for the 'MAIN_LOG'
  # object.

  logging:
    format:
      banner: "%(asctime)s [ %(levelname)s ] %(name)s - %(message)s"
      date: "%Y-%m-%d"
      time: "%H:%M:%S"
